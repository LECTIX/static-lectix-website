name: Vérification du site

on:
  push:
    branches: [main, docs/plan-migration-site-statique]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier Astro et TypeScript
        run: npm run check

      - name: Construire le site statique
        run: npm run build
